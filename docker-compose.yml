# docker-compose.yml
x-airflow-common: &airflow-common
  image: mlops-airflow:3.1.0-python3.12
  build:
    context: .
    dockerfile: Dockerfile
  pull_policy: never
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__SECRET_KEY: "bdeefb532081785bd293f20adc87f955844128126f06dbda307a6a953e18887f" # new authentification 
    AIRFLOW__API_AUTH__JWT_SECRET: "ZJ90ElEex9HenwxaTb7eMH7f5D2f1rAe3BiiYClqYtw="
   # AIRFLOW__CORE__FERNET_KEY: "ZJ90ElEex9HenwxaTb7eMH7f5D2f1rAe3BiiYClqYtw="  # new authentification 
    

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/ # explicit url 

    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:Admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/logs/simple_auth_manager_passwords.json

    PYTHONPATH: /opt/airflow/src
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./models:/opt/airflow/models
    - airflow_logs:/opt/airflow/logs
  restart: unless-stopped

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  airflow-init:
    <<: *airflow-common
    entrypoint: ["/bin/bash", "-lc"]
    command: ["set -euo pipefail; airflow db migrate; echo 'init done'"]
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: api-server

  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  airflow-dag-processor:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: dag-processor

  airflow-triggerer:
    <<: *airflow-common
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: triggerer

volumes:
  pgdata:
  airflow_logs: