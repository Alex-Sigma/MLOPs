[project]
name = "l9-dvc-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"


dependencies = [
    "dvc[s3]>=3.63.0",
    "torch==2.6.0",
    "click>=8.2.1",
    "matplotlib>=3.10.3",
    "numpy>=2.2.6",
    "pillow>=11.2.1",
    "seaborn>=0.13.2",
    "torchinfo>=1.8.0",
    "torchvision==0.21.0",
    "mlflow>=2.17.0",
    "python-dotenv>=1.1.1",
    "fastai>=2.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
]
